<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="410" viewBox="0 0 1440 410" role="img" aria-labelledby="title">
<title id="title">One discovery. Four different questions.</title>
<defs><linearGradient id="g"><stop stop-color="#ff8eab"/><stop offset=".33" stop-color="#f8d38a"/><stop offset=".66" stop-color="#8de6cb"/><stop offset="1" stop-color="#bca4ff"/></linearGradient></defs>
<rect width="1440" height="410" rx="22" fill="#11121b"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="44" y="54" fill="#9296ae" font-size="11" letter-spacing="3">THE GROK RESEARCH ROOM</text><text x="42" y="108" fill="#eef0f7" font-size="36" font-weight="600" letter-spacing="-1">One discovery. <tspan fill="url(#g)">Four different questions.</tspan></text>
<g transform="translate(40 150)"><rect width="326" height="215" rx="13" fill="#241b25" stroke="#704050"/><circle cx="37" cy="39" r="13" fill="none" stroke="#ed97b1" stroke-width="2"/><circle cx="37" cy="39" r="4" fill="#ed97b1"/><text x="64" y="46" fill="#f0b8c8" font-size="20" font-weight="600">Lookout</text><text x="24" y="94" fill="#f1e8ed" font-size="17">What is moving?</text><text x="24" y="125" fill="#a78f9f" font-size="13">Novelty. Attention. Context.</text><text x="24" y="184" fill="#d88fa5" font-size="10" letter-spacing="1.3">SIGNAL ≠ HYPE</text></g>
<g transform="translate(384 150)"><rect width="326" height="215" rx="13" fill="#25211b" stroke="#70603d"/><path d="m419 176-12 7v15l12 7 12-7v-15Z" transform="translate(-384 -150)" fill="none" stroke="#f1cf8a" stroke-width="2"/><text x="64" y="46" fill="#f3d9a9" font-size="20" font-weight="600">Maker</text><text x="24" y="94" fill="#f1eee5" font-size="17">What is actually built?</text><text x="24" y="125" fill="#a59a82" font-size="13">Code. Product. Documentation.</text><text x="24" y="184" fill="#d9be87" font-size="10" letter-spacing="1.3">SHOW THE WORK</text></g>
<g transform="translate(728 150)"><rect width="326" height="215" rx="13" fill="#192722" stroke="#3d6c5b"/><path d="m37 23 13 6v14q0 11-13 16-13-5-13-16V29Z" fill="none" stroke="#91e5c7" stroke-width="2"/><text x="64" y="46" fill="#b1ecd7" font-size="20" font-weight="600">Skeptic</text><text x="24" y="94" fill="#e5f0eb" font-size="17">What does not add up?</text><text x="24" y="125" fill="#85a397" font-size="13">Contradictions. Gaps. Red flags.</text><text x="24" y="184" fill="#8bd4b8" font-size="10" letter-spacing="1.3">DOUBT IS A FEATURE</text></g>
<g transform="translate(1072 150)"><rect width="326" height="215" rx="13" fill="#211d30" stroke="#5f4d83"/><path d="m25 51 24-24m-17 0h17v17" fill="none" stroke="#bca4ff" stroke-width="2"/><text x="64" y="46" fill="#d3c3f5" font-size="20" font-weight="600">Runner</text><text x="24" y="94" fill="#eee9f5" font-size="17">Is it worth a closer look?</text><text x="24" y="125" fill="#9a8cae" font-size="13">Enough evidence to investigate?</text><text x="24" y="184" fill="#b3a0d7" font-size="10" letter-spacing="1.3">RESEARCH, NOT A TRADE</text></g>
</g></svg>
