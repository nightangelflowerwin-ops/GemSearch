name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python3 scripts/CheckTextStyle.py
      - run: python3 -m pip install -r RequirementsDesktop.txt
      - run: npm ci --ignore-scripts
      - run: python3 -m unittest discover -s tests -p 'Test*.py' -v
      - run: python3 tests/HttpExtensionSmoke.py
      - run: python3 tests/HttpBridgeSmoke.py
      - run: npm test
      - run: python3 scripts/PackageExtension.py
      - uses: actions/upload-artifact@v4
        with:
          name: GemSearchExtension
          path: dist/GemSearchExtension.zip
